
<style>
*{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.stepper{padding:1rem 0}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--color-border-secondary);transition:background .25s,transform .25s;cursor:pointer}
.dot.active{background:var(--color-text-primary);transform:scale(1.3)}
.dot.done{background:var(--color-border-primary)}
.panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem;background:var(--color-background-primary)}
.panel-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:.35rem}
.panel-sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:1rem;line-height:1.6}
.vis{width:100%;overflow:hidden;border-radius:var(--border-radius-md);margin-bottom:1rem}
.insight{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem 1rem;font-size:12px;color:var(--color-text-secondary);line-height:1.6;border-left:2px solid var(--color-border-primary)}
.insight strong{color:var(--color-text-primary);font-weight:500}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav button{font-size:13px;padding:6px 18px}
.nav .counter{font-size:12px;color:var(--color-text-tertiary)}
</style>

<h2 class="sr-only">Interactive walkthrough of model training: forward pass, loss calculation, backpropagation, weight update, and epoch loop</h2>

<div class="stepper">
  <div class="dots" id="dots"></div>
  <div class="panel" id="panel"></div>
  <div class="nav">
    <button id="prev" onclick="go(-1)">← Previous</button>
    <span class="counter" id="counter"></span>
    <button id="next" onclick="go(1)">Next →</button>
  </div>
</div>

<script>
const steps = [
  {
    title: "Step 1 — Input: one batch of X-ray images enters",
    sub: "Training doesn't use all 5,216 images at once. We split them into batches of 32. The model sees batch 1, learns from it, then batch 2, and so on. One full pass through all batches = 1 epoch.",
    svg: `<svg width="100%" viewBox="0 0 680 180" role="img"><title>Batch of 32 X-ray images entering the model</title><desc>32 small image tiles labeled with their true class flowing into VGG16</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <text class="ts" x="20" y="22" dominant-baseline="central">Batch of 32 images</text>
    ${Array.from({length:16},(_,i)=>{const x=20+(i%8)*36,y=34+Math.floor(i/8)*36,isPneu=i%3!==0;return `<rect x="${x}" y="${y}" width="28" height="28" rx="4" fill="${isPneu?'#FAECE7':'#E1F5EE'}" stroke="${isPneu?'#993C1D':'#0F6E56'}" stroke-width="0.5"/><text x="${x+14}" y="${y+14}" text-anchor="middle" dominant-baseline="central" style="font-size:8px;fill:${isPneu?'#712B13':'#085041'}">${isPneu?'P':'N'}</text>`;}).join('')}
    <text class="ts" x="20" y="115" dominant-baseline="central" style="fill:#993C1D">P = Pneumonia</text>
    <text class="ts" x="120" y="115" dominant-baseline="central" style="fill:#0F6E56">N = Normal</text>
    <text class="ts" x="20" y="135" dominant-baseline="central">Each image: 224×224×3 pixels · Label: 0 or 1</text>
    <line x1="310" y1="70" x2="400" y2="70" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="400" y="44" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="520" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">VGG16 model</text>
    <text class="ts" x="520" y="82" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Waiting to process batch</text>
    <text class="ts" x="520" y="140" text-anchor="middle" dominant-baseline="central">163 batches per epoch · 20 epochs total</text>
    </svg>`,
    insight: "<strong>Why batch size 32?</strong> If we used 1 image at a time, weight updates are very noisy. If we used all 5,216 at once, we need huge memory. 32 is the sweet spot — stable gradients, fits in GPU memory, trains well."
  },
  {
    title: "Step 2 — Forward pass: image travels through VGG16 layers",
    sub: "Every pixel value passes through 16 layers of VGG16. Each layer transforms the data — early layers detect edges, middle layers detect shapes, deep layers detect high-level patterns like 'lung opacity'. At the end, a single probability number comes out.",
    svg: `<svg width="100%" viewBox="0 0 680 200" role="img"><title>X-ray image flowing through VGG16 layers producing a probability</title><desc>Data flows left to right: input image through conv blocks 1-5 then dense layers to sigmoid output</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <rect x="10" y="70" width="60" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="ts" x="40" y="94" text-anchor="middle" dominant-baseline="central" style="fill:#2C2C2A">X-ray</text>
    <text class="ts" x="40" y="110" text-anchor="middle" dominant-baseline="central" style="fill:#444441">224×224</text>
    <line x1="70" y1="100" x2="90" y2="100" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="90" y="60" width="70" height="80" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="125" y="85" text-anchor="middle" dominant-baseline="central" style="fill:#042C53">Block 1+2</text>
    <text class="ts" x="125" y="103" text-anchor="middle" dominant-baseline="central" style="fill:#185FA5">Edges</text>
    <text class="ts" x="125" y="121" text-anchor="middle" dominant-baseline="central" style="fill:#185FA5">Curves</text>
    <line x1="160" y1="100" x2="178" y2="100" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="178" y="50" width="80" height="100" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="218" y="80" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Block 3+4</text>
    <text class="ts" x="218" y="98" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">Shapes</text>
    <text class="ts" x="218" y="116" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">Textures</text>
    <line x1="258" y1="100" x2="276" y2="100" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="276" y="40" width="80" height="120" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="ts" x="316" y="74" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">Block 5</text>
    <text class="ts" x="316" y="92" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Lung</text>
    <text class="ts" x="316" y="110" text-anchor="middle" dominant-baseline="central" style="fill:#085041">patterns</text>
    <text class="ts" x="316" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Opacity</text>
    <line x1="356" y1="100" x2="374" y2="100" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="374" y="55" width="90" height="90" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="ts" x="419" y="85" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Dense 256</text>
    <text class="ts" x="419" y="103" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Our custom</text>
    <text class="ts" x="419" y="121" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">head layer</text>
    <line x1="464" y1="100" x2="482" y2="100" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="482" y="68" width="80" height="64" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
    <text class="ts" x="522" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#412402">Sigmoid</text>
    <text class="ts" x="522" y="108" text-anchor="middle" dominant-baseline="central" style="fill:#633806">Output</text>
    <line x1="562" y1="100" x2="582" y2="100" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="582" y="74" width="88" height="52" rx="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text class="th" x="626" y="96" text-anchor="middle" dominant-baseline="central" style="fill:#085041">0.87</text>
    <text class="ts" x="626" y="114" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">= 87% pneumonia</text>
    <text class="ts" x="340" y="178" text-anchor="middle">VGG16 frozen layers (weights fixed) ←→ Custom head (weights trainable)</text>
    </svg>`,
    insight: "<strong>Key insight:</strong> The VGG16 base is FROZEN — its weights don't change. It's a feature extractor. Only the Dense 256 layer and final sigmoid learn new weights for pneumonia detection. This is why it trains fast even on a small dataset."
  },
  {
    title: "Step 3 — Loss calculation: how wrong were we?",
    sub: "The model predicted 0.87 (87% pneumonia). The true label is 1 (definitely pneumonia). Binary Cross-Entropy compares these and gives a loss score — a number representing how wrong the prediction is.",
    svg: `<svg width="100%" viewBox="0 0 680 210" role="img"><title>Binary cross-entropy loss calculation showing prediction vs true label</title><desc>Formula showing loss equals negative log of 0.87 equals 0.139 for correct confident prediction</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <rect x="20" y="20" width="180" height="60" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="110" y="42" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">Predicted: 0.87</text>
    <text class="ts" x="110" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Model says 87% pneumonia</text>
    <rect x="20" y="96" width="180" height="60" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
    <text class="th" x="110" y="118" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">True label: 1</text>
    <text class="ts" x="110" y="138" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Actually IS pneumonia</text>
    <line x1="200" y1="50" x2="260" y2="95" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <line x1="200" y1="126" x2="260" y2="105" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="260" y="60" width="200" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="360" y="82" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Loss formula</text>
    <text class="ts" x="360" y="100" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">-[1·log(0.87) + 0·log(0.13)]</text>
    <text class="ts" x="360" y="118" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">= -log(0.87) = 0.139</text>
    <line x1="460" y1="94" x2="490" y2="94" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="490" y="68" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="575" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">Loss = 0.139</text>
    <text class="ts" x="575" y="106" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Small = good prediction</text>
    <text class="ts" x="60" y="178" dominant-baseline="central" style="fill:var(--color-text-secondary)">Wrong + confident example:</text>
    <rect x="230" y="165" width="200" height="28" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="ts" x="330" y="179" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">y=1, pred=0.05 → Loss = 3.0 (huge!)</text>
    <text class="ts" x="20" y="200" dominant-baseline="central" style="fill:var(--color-text-tertiary)">The more confident and more wrong, the bigger the penalty</text>
    </svg>`,
    insight: "<strong>Why this matters in medicine:</strong> Predicting 'Normal' (0.05) when the patient has Pneumonia gives a loss of 3.0. Predicting 'Pneumonia' (0.87) correctly gives 0.139. The loss function punishes dangerous mistakes very heavily, guiding the model to avoid them."
  },
  {
    title: "Step 4 — Backpropagation: trace which weights caused the error",
    sub: "Now we work backwards. Using calculus (chain rule), we calculate how much each weight in the custom head layers contributed to the loss. This gives us a 'gradient' for each weight — a number saying 'increase me' or 'decrease me' and by how much.",
    svg: `<svg width="100%" viewBox="0 0 680 220" role="img"><title>Backpropagation flowing error signal backwards through the network layers</title><desc>Red error signal flows right to left, frozen VGG16 layers receive gradients but don't update</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <text class="ts" x="340" y="18" text-anchor="middle" dominant-baseline="central">Direction of backpropagation (error flows RIGHT to LEFT)</text>
    <rect x="582" y="40" width="88" height="44" rx="22" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="th" x="626" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Loss=0.139</text>
    <line x1="582" y1="62" x2="556" y2="62" stroke="#D85A30" stroke-width="2" marker-end="url(#a)"/>
    <rect x="460" y="40" width="96" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
    <text class="th" x="508" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Sigmoid</text>
    <text class="ts" x="508" y="73" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">grad computed</text>
    <line x1="460" y1="62" x2="434" y2="62" stroke="#D85A30" stroke-width="2" marker-end="url(#a)"/>
    <rect x="300" y="30" width="134" height="64" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
    <text class="th" x="367" y="52" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Dense 256</text>
    <text class="ts" x="367" y="68" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">grad computed</text>
    <text class="ts" x="367" y="84" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">WILL update weights</text>
    <line x1="300" y1="62" x2="272" y2="62" stroke="#D85A30" stroke-width="2" marker-end="url(#a)"/>
    <rect x="100" y="40" width="172" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text class="th" x="186" y="65" text-anchor="middle" dominant-baseline="central" style="fill:#2C2C2A">VGG16 frozen layers</text>
    <text class="ts" x="186" y="83" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">Gradients computed</text>
    <text class="ts" x="186" y="99" text-anchor="middle" dominant-baseline="central" style="fill:#888780">but weights NOT updated</text>
    <line x1="100" y1="80" x2="72" y2="80" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <rect x="10" y="60" width="62" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="ts" x="41" y="76" text-anchor="middle" dominant-baseline="central" style="fill:#2C2C2A">Input</text>
    <text class="ts" x="41" y="92" text-anchor="middle" dominant-baseline="central" style="fill:#888780">stopped</text>
    <text class="ts" x="340" y="145" text-anchor="middle">What a gradient tells us for each weight:</text>
    <rect x="60" y="160" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="ts" x="150" y="178" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">Positive gradient</text>
    <text class="ts" x="150" y="196" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Decrease this weight</text>
    <rect x="260" y="160" width="180" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="ts" x="350" y="178" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Negative gradient</text>
    <text class="ts" x="350" y="196" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Increase this weight</text>
    <rect x="460" y="160" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="550" y="178" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Large gradient</text>
    <text class="ts" x="550" y="196" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">Big change needed</text>
    </svg>`,
    insight: "<strong>Chain rule in simple terms:</strong> Think of a chain of people passing blame. The sigmoid says 'Dense layer, you're 70% responsible'. Dense says 'VGG block 5, you're responsible'. But VGG is frozen — it hears the blame but ignores it. Only Dense updates."
  },
  {
    title: "Step 5 — Weight update: Adam optimizer adjusts the weights",
    sub: "Now Adam uses the gradients to nudge each weight slightly in the direction that reduces loss. The learning rate (0.0001) controls how big each nudge is. Very small — because we don't want to ruin the pre-trained VGG16 knowledge.",
    svg: `<svg width="100%" viewBox="0 0 680 220" role="img"><title>Adam optimizer updating weights using gradient and learning rate</title><desc>Before and after weight values shown with Adam formula and momentum/RMSprop components</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <rect x="10" y="20" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="90" y="42" text-anchor="middle" dominant-baseline="central" style="fill:#2C2C2A">Old weight</text>
    <text class="th" x="90" y="66" text-anchor="middle" dominant-baseline="central" style="fill:#2C2C2A;font-size:18px">w = 0.532</text>
    <text class="ts" x="90" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">gradient = −0.024</text>
    <line x1="170" y1="60" x2="210" y2="60" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="210" y="10" width="260" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Adam update rule</text>
    <text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">m = 0.9 × m_prev + 0.1 × gradient</text>
    <text class="ts" x="340" y="74" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">v = 0.999 × v_prev + 0.001 × gradient²</text>
    <text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">w = w − 0.0001 × m / √v</text>
    <line x1="470" y1="60" x2="510" y2="60" stroke="var(--t)" stroke-width="1" marker-end="url(#a)"/>
    <rect x="510" y="20" width="160" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="590" y="42" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">New weight</text>
    <text class="th" x="590" y="66" text-anchor="middle" dominant-baseline="central" style="fill:#04342C;font-size:18px">w = 0.534</text>
    <text class="ts" x="590" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#085041">tiny nudge upward</text>
    <text class="ts" x="60" y="132" dominant-baseline="central" style="fill:var(--color-text-secondary)">Adam's two smart components:</text>
    <rect x="10" y="148" width="310" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="165" y="167" text-anchor="middle" dominant-baseline="central" style="fill:#412402">Momentum (m)</text>
    <text class="ts" x="165" y="187" text-anchor="middle" dominant-baseline="central" style="fill:#633806">Remembers past gradients, smooths the path</text>
    <rect x="340" y="148" width="330" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="505" y="167" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">Adaptive rate (v)</text>
    <text class="ts" x="505" y="187" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Weights that fluctuate a lot get smaller steps</text>
    </svg>`,
    insight: "<strong>Why learning rate 0.0001 (very small)?</strong> VGG16's weights were trained on 14 million images. A large learning rate (like 0.01) would destroy that knowledge in a few updates. Small rate = careful, surgical adjustments to the custom head only."
  },
  {
    title: "Step 6 — One epoch: repeating this for all 163 batches",
    sub: "Steps 1–5 happen for every batch. With 5,216 training images and batch size 32, there are 163 batches per epoch. After all 163 batches complete, one epoch is done. The model has seen every training image once.",
    svg: `<svg width="100%" viewBox="0 0 680 200" role="img"><title>Epoch loop showing 163 batches completing one full pass through the dataset</title><desc>Progress bar showing batch progress and loss curve declining across batches</desc>
    <text class="th" x="340" y="22" text-anchor="middle" dominant-baseline="central">Epoch 1 progress</text>
    <rect x="20" y="38" width="640" height="24" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <rect x="20" y="38" width="480" height="24" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="ts" x="340" y="50" text-anchor="middle" dominant-baseline="central" style="fill:#04342C">Batch 120 / 163 — Loss: 0.31</text>
    <text class="ts" x="20" y="82" dominant-baseline="central">Loss per batch (decreasing as model learns):</text>

let cur = 0;

function render() {
  const s = steps[cur];
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = steps.map((_,i) =>
    `<div class="dot ${i===cur?'active':i<cur?'done':''}" onclick="jump(${i})"></div>`
  ).join('');
  document.getElementById('panel').innerHTML = `
    <div class="panel-title">${s.title}</div>
    <div class="panel-sub">${s.sub}</div>
    <div class="vis">${s.svg}</div>
    <div class="insight">${s.insight}</div>
  `;
  document.getElementById('counter').textContent = `${cur+1} of ${steps.length}`;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = cur === steps.length-1 ? 'Done' : 'Next →';
}

function go(d) {
  cur = Math.max(0, Math.min(steps.length-1, cur+d));
  render();
}
function jump(i) { cur=i; render(); }
render();
</script>
